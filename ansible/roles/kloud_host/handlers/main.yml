---
- name: Validate and reload ssh
  ansible.builtin.shell: /usr/sbin/sshd -t && systemctl reload ssh
  changed_when: true
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
- name: Disable swap
  ansible.builtin.command: swapoff --all
  changed_when: true
- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
