---
- name: Apply Kloud firewall
  ansible.builtin.systemd_service:
    name: kloud-firewall
    state: restarted
    daemon_reload: true
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: wg-quick@wg-kore
    state: restarted
- name: Restart video namespace
  ansible.builtin.systemd_service:
    name: kloud-video-netns
    state: restarted
    daemon_reload: true
- name: Restart video proxy
  ansible.builtin.systemd_service:
    name: kloud-video-proxy
    state: restarted
    daemon_reload: true
