---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: minio
  annotations:
    prometheus.io/path: /minio/v2/metrics/cluster
    prometheus.io/port: "9000"
    prometheus.io/scrape: "true"
  labels:
    app: minio
spec:
  # certConfig: {}
  configuration:
    name: minio-config
  # externalCaCertSecret: []
  # externalCertSecret: []
  # externalClientCertSecrets: []
  features:
    bucketDNS: false
    domains: {}
  image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z@sha256:46b3009bf7041eefbd90bd0d2b38c6ddc24d20a35d609551a1802c558c1c958f
  mountPath: /export
  podManagementPolicy: Parallel
  pools:
    - name: pool-0
      servers: 3
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumeClaimTemplate:
        apiVersion: v1
        kind: persistentvolumeclaims
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn-crypto-global-single-replica
      volumesPerServer: 2
  requestAutoCert: false
  env:
    - name: MINIO_IDENTITY_OPENID_ENABLE
      value: "on"
    - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
      value: "Fraccs SSO"
    - name: MINIO_IDENTITY_OPENID_CONFIG_URL
      value: "https://auth.47fc5c.com/application/o/minio/.well-known/openid-configuration"
    - name: MINIO_IDENTITY_OPENID_SCOPES
      value: "openid,profile,email,minio"
    - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
      value: "policy"
    - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
      value: "https://ui.minio.47fc5c.com/oauth_callback"
    - name: MINIO_IDENTITY_OPENID_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: minio-oidc
          key: MINIO_IDENTITY_OPENID_CLIENT_ID
    - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: minio-oidc
          key: MINIO_IDENTITY_OPENID_CLIENT_SECRET
