---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr.fraccs.com`)
      kind: Rule
      services:
        - name: sonarr
          kind: Service
          port: 8989
          scheme: http
  tls:
    secretName: sonarr-fraccs-com-certificate
