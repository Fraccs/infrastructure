---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: freshrss
  namespace: freshrss
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`freshrss.fraccs.com`)
      kind: Rule
      services:
        - name: freshrss
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: freshrss-fraccs-com-certificate
