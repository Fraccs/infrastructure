---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: docker.io/freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
          ports:
            - containerPort: 80
          volumeMounts:
            - name: freshrss
              mountPath: /var/www/FreshRSS/data
              subPath: data/
            - name: freshrss
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions/
          envFrom:
            - configMapRef:
                name: freshrss
      volumes:
        - name: freshrss
          persistentVolumeClaim:
            claimName: freshrss
