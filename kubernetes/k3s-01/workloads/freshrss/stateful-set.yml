---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: docker.io/freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
          ports:
            - containerPort: 80
          volumeMounts:
            - name: freshrss
              mountPath: /var/www/FreshRSS/data
              subPath: data/
            - name: freshrss
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions/
          envFrom:
            - configMapRef:
                name: freshrss
      volumes:
        - name: freshrss
          persistentVolumeClaim:
            claimName: freshrss
