---
# Loads default set of integrations. Do not remove.
default_config:

# Dashboard definitions are managed in Git; resources remain managed by HACS/UI.
lovelace: !include git-dashboards/lovelace.yml

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  # Install kiosk-mode through HACS; register its module for YAML dashboards.
  extra_module_url:
    - /hacsfiles/kiosk-mode/kiosk-mode.js

automation: !include git-automations/index.yml
# Conventional runtime filenames; ConfigMap source files use .yml in Git.
script: !include scripts.yaml
scene: !include scenes.yaml

timer: !include git-helpers/timers.yml
template: !include git-helpers/template-sensors.yml

sensor: !include git-helpers/integral-sensors.yml
