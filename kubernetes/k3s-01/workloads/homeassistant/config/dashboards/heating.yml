---
# Nintendo Switch / LineageOS: responsive 1280x720 landscape target.
# Live indoor temperature from the dining room sensor.
button_card_templates:
  heating_i18n:
    variables:
      i18n: |
        [[[
          const language = hass.locale?.language || hass.language || 'en';
          const italian = language.toLowerCase().split('-')[0] === 'it';
          return {
            locale: italian ? 'it-IT' : 'en-GB',
            title: italian ? 'CASA / RISCALDAMENTO' : 'HOME / HEATING',
            browse: italian ? 'Apri Home Assistant' : 'Browse Home Assistant',
            temperature: italian ? 'TEMPERATURA INTERNA' : 'INDOOR TEMPERATURE'
          };
        ]]]

kiosk_mode:
  user_settings:
    - users:
        - Orbit
      kiosk: true

views:
  - title: Heating
    path: heating
    icon: mdi:home-thermometer
    type: panel
    cards:
      - type: custom:button-card
        template: heating_i18n
        entity: sensor.sala_da_pranzo_satellite_01_temperatura
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - position: relative
            # kiosk-mode supplies zero header height when hiding HA navigation.
            - height: calc(100vh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px))
            - margin: 0
            - padding: 0
            - box-sizing: border-box
            - background: transparent
            - border: 0
            - border-radius: 0
            - box-shadow: none
            - color: var(--primary-text-color)
            - font-family: system-ui, -apple-system, sans-serif
          grid:
            - grid-template-areas: '"header" "temperature"'
            - grid-template-columns: minmax(0, 1fr)
            - grid-template-rows: auto minmax(0, 1fr)
            - height: 100%
            - box-sizing: border-box
            - padding: clamp(16px, 3vw, 40px)
            - padding-bottom: max(16px, env(safe-area-inset-bottom, 0px))
            - gap: 16px
          custom_fields:
            header:
              - min-width: 0
              - text-align: left
            temperature:
              - min-width: 0
              - justify-self: center
              - align-self: center
              - text-align: center
        extra_styles: |
          :host { width: 100%; max-width: none !important; }
          @supports (height: 100dvh) {
            #card { height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px)); }
          }
          .heating-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; white-space: normal;
          }
          .heating-title { font-size: clamp(12px, 1.5vw, 18px); letter-spacing: .1em; font-weight: 650; }
          .heating-exit {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 48px; padding: 0 16px; box-sizing: border-box;
            border: 1px solid var(--divider-color, #777); border-radius: 12px;
            color: var(--primary-text-color); text-decoration: none;
            font-size: 14px; font-weight: 600; touch-action: manipulation;
            pointer-events: auto; cursor: pointer;
          }
          .heating-exit:focus-visible { outline: 3px solid var(--primary-color, #03a9f4); outline-offset: 3px; }
          .heating-value {
            font-size: clamp(72px, min(18vw, 34vh), 220px);
            line-height: 1.05; letter-spacing: -.065em; font-weight: 300;
            font-variant-numeric: tabular-nums; white-space: nowrap;
          }
          .heating-degree { font-size: .35em; vertical-align: top; line-height: 1.8; letter-spacing: 0; }
          .heating-label { font-size: clamp(11px, 1.3vw, 16px); letter-spacing: .1em; color: var(--secondary-text-color); white-space: normal; }
        custom_fields:
          header: |
            [[[
              const t = variables.i18n;
              return `<header class="heating-header">
                <span class="heating-title">${t.title}</span>
                <a class="heating-exit" href="/overview-dashboard/default_view?disable_km"
                   onclick="event.stopPropagation()" ontouchend="event.stopPropagation()"
                   onkeydown="event.stopPropagation()">${t.browse}</a>
              </header>`;
            ]]]
          temperature: |
            [[[
              const value = entity?.state;
              const number = Number(value);
              const formatted = value !== null && value !== undefined && value !== '' && Number.isFinite(number)
                ? new Intl.NumberFormat(variables.i18n.locale, {minimumFractionDigits: 1, maximumFractionDigits: 1}).format(number) : '—';
              return `<div class="heating-temperature">
                <div class="heating-value">${formatted}<span class="heating-degree">°C</span></div>
                <div class="heating-label">${variables.i18n.temperature}</div>
              </div>`;
            ]]]
