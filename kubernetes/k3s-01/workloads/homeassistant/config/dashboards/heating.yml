---
# Nintendo Switch V1 — Home Assistant heating dashboard
# 1280 x 720 landscape, Frosted Glass theme-compatible
# Git-managed YAML dashboard, registered by lovelace.yml.
# Requires HACS custom:button-card
# DEMO ONLY: hard-coded values; no sensor or Shelly calls.

views:
  - title: Heating
    path: heating
    icon: mdi:home-thermometer
    type: panel
    cards:
      - type: custom:button-card

        variables:
          demo_temperature: 19.4
          demo_threshold: 20.0
          demo_relay_on: true

        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none

        # Fix for the unused right-hand ~25%: escape any width limit
        # imposed by the view or a theme. Anchor the card to the
        # BROWSER VIEWPORT rather than its Home Assistant parent.
        styles:
          card:
            - position: fixed
            - top: 56px
            - left: 0
            - right: 0
            - bottom: 0
            - width: 100vw
            - max-width: none
            - min-width: 100vw
            - height: calc(100dvh - 56px)
            - margin: 0
            - padding: 0
            - box-sizing: border-box
            - background: transparent
            - background-image: none
            - backdrop-filter: none
            - -webkit-backdrop-filter: none
            - border: 0
            - border-radius: 0
            - box-shadow: none
            - overflow: hidden
            - color: var(--primary-text-color)
            - font-family: system-ui, -apple-system, sans-serif
          grid:
            - grid-template-areas: '"stage"'
            - grid-template-columns: minmax(0, 1fr)
            - grid-template-rows: minmax(0, 1fr)
            - width: 100%
            - height: 100%
            - min-width: 0
            - min-height: 0
          custom_fields:
            stage:
              - grid-area: stage
              - width: 100%
              - height: 100%
              - min-width: 0
              - min-height: 0
              - overflow: hidden
              - align-self: stretch
              - justify-self: stretch
              - text-align: left

        # One field controls all positioning, avoiding implicit CSS-grid
        # columns created by separate custom fields.
        custom_fields:
          stage: |
            [[[
              const temp = Number(variables.demo_temperature).toFixed(1);
              const threshold = Number(variables.demo_threshold).toFixed(1);
              const heating = variables.demo_relay_on === true;
              const status = heating ? 'HEAT REQUESTED · DEMO' : 'HEATING IDLE · DEMO';
              const statusColor = heating
                ? 'var(--warning-color, #f0aa52)'
                : 'var(--secondary-text-color, #a0a8b2)';
              return `
                <div style="position:relative;width:100%;height:100%;overflow:hidden;box-sizing:border-box;font-family:inherit;color:var(--primary-text-color);background:transparent;">

                  <div style="position:absolute;top:28px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;white-space:nowrap;">
                    <span style="font-size:17px;font-weight:650;letter-spacing:.17em;">HOME / HEATING</span>
                    <span style="font-size:13px;font-weight:600;letter-spacing:.13em;color:var(--secondary-text-color);">DEMO MODE</span>
                  </div>

                  <div style="position:absolute;top:47%;left:48%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;">
                    <div style="font-size:clamp(130px,18vw,245px);font-weight:300;letter-spacing:-.075em;line-height:1.06;font-variant-numeric:tabular-nums;">
                      ${temp}<span style="font-size:.32em;vertical-align:top;line-height:1.8;letter-spacing:0;margin-left:.04em;">°</span>
                    </div>
                    <div style="margin-top:18px;font-size:16px;letter-spacing:.21em;font-weight:600;color:var(--secondary-text-color);">INDOOR TEMPERATURE</div>
                  </div>

                  <div style="position:absolute;top:50%;right:48px;transform:translateY(-50%);width:176px;white-space:nowrap;text-align:left;background:transparent;border:0;box-shadow:none;">
                    <div style="font-size:12px;font-weight:650;letter-spacing:.13em;color:var(--secondary-text-color);">THRESHOLD NOW</div>
                    <div style="margin:8px 0;font-size:58px;line-height:1.2;font-weight:350;letter-spacing:-.055em;">${threshold}<span style="font-size:.5em;vertical-align:top;line-height:1.7;letter-spacing:0;">°</span></div>
                    <div style="font-size:13px;color:var(--secondary-text-color);">Heating setpoint</div>
                  </div>

                  <div style="position:absolute;bottom:32px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:var(--secondary-text-color);font-size:13px;font-weight:650;letter-spacing:.11em;white-space:nowrap;">
                    <span style="display:flex;align-items:center;gap:12px;">
                      <span style="display:inline-block;width:11px;height:11px;flex:0 0 11px;border-radius:50%;background:${statusColor};"></span>
                      ${status}
                    </span>
                    <span>TEST VALUES · NOT LIVE</span>
                  </div>

                </div>`;
            ]]]
