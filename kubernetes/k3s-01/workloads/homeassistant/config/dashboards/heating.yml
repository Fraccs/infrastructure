---
# Nintendo Switch / LineageOS: target 1280x720 landscape; CSS viewport may differ.
# Requires HACS button-card and kiosk-mode. Match the tablet account DISPLAY name.
# DEMO ONLY: hard-coded readings; no heating control actions.
kiosk_mode:
  user_settings:
    - users:
        - Heating tablet
      kiosk: true

views:
  - title: Heating
    path: heating
    icon: mdi:home-thermometer
    type: panel
    cards:
      - type: custom:button-card
        variables:
          demo_temperature: 19.4
          demo_threshold: 20.0
          demo_relay_on: true
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - position: relative
            - width: 100%
            # kiosk-mode supplies zero header height when hiding HA navigation.
            - height: calc(100vh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px))
            - margin: 0
            - padding: 0
            - box-sizing: border-box
            - background: transparent
            - border: 0
            - border-radius: 0
            - box-shadow: none
            - overflow: hidden
            - color: var(--primary-text-color)
            - font-family: system-ui, -apple-system, sans-serif
          grid:
            - grid-template-areas: '"stage"'
            - grid-template-columns: minmax(0, 1fr)
            - grid-template-rows: minmax(0, 1fr)
            - height: 100%
          custom_fields:
            stage:
              - height: 100%
              - min-width: 0
              - min-height: 0
              - text-align: left
        extra_styles: |
          :host { width: 100%; max-width: none !important; }
          @supports (height: 100dvh) {
            #card {
              height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px));
            }
          }
          .heating-stage {
            height: 100%; box-sizing: border-box;
            padding: clamp(16px, 3vw, 40px);
            padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
            display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 16px; color: var(--primary-text-color);
          }
          .heating-header, .heating-footer {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
          }
          .heating-title { font-size: clamp(12px, 1.5vw, 18px); letter-spacing: .13em; font-weight: 650; }
          .heating-exit {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 48px; padding: 0 16px; box-sizing: border-box;
            border: 1px solid var(--divider-color, #777); border-radius: 12px;
            color: var(--primary-text-color); text-decoration: none;
            font-size: 14px; font-weight: 600; touch-action: manipulation;
            pointer-events: auto; cursor: pointer;
          }
          .heating-exit:focus-visible { outline: 3px solid var(--primary-color, #03a9f4); outline-offset: 3px; }
          .heating-readings {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, .4fr);
            align-items: center; gap: clamp(16px, 4vw, 48px); min-height: 0;
          }
          .heating-temperature { text-align: center; min-width: 0; }
          .heating-value {
            font-size: clamp(72px, min(18vw, 34vh), 220px);
            line-height: 1.05; letter-spacing: -.065em; font-weight: 300;
            font-variant-numeric: tabular-nums; white-space: nowrap;
          }
          .heating-degree { font-size: .35em; vertical-align: top; line-height: 1.8; letter-spacing: 0; }
          .heating-label { font-size: clamp(11px, 1.3vw, 16px); letter-spacing: .12em; color: var(--secondary-text-color); }
          .heating-setpoint-value { font-size: clamp(36px, 6vw, 64px); font-weight: 350; margin: 8px 0; }
          .heating-footer { font-size: 12px; letter-spacing: .07em; color: var(--secondary-text-color); }
          .heating-status { display: inline-flex; align-items: center; gap: 10px; }
          .heating-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--heating-status-color); }
          @media (max-width: 500px) {
            .heating-readings { grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .heating-setpoint { text-align: center; }
          }
        custom_fields:
          stage: |
            [[[
              const reading = value => {
                if (value === null || value === undefined || value === '') return '—';
                const number = Number(value);
                return Number.isFinite(number) ? number.toFixed(1) : '—';
              };
              const temp = reading(variables.demo_temperature);
              const threshold = reading(variables.demo_threshold);
              const heating = variables.demo_relay_on === true;
              const status = heating ? 'HEAT REQUESTED' : 'HEATING IDLE';
              const statusColor = heating
                ? 'var(--warning-color, #f0aa52)'
                : 'var(--secondary-text-color, #a0a8b2)';
              return `
                <section class="heating-stage" aria-label="Heating demonstration" style="--heating-status-color:${statusColor}">
                  <header class="heating-header">
                    <span class="heating-title">HOME / HEATING</span>
                    <a class="heating-exit" href="/overview-dashboard/default_view?disable_km"
                       onclick="event.stopPropagation()" ontouchend="event.stopPropagation()"
                       onkeydown="event.stopPropagation()">Browse Home Assistant</a>
                  </header>
                  <div class="heating-readings">
                    <div class="heating-temperature">
                      <div class="heating-value">${temp}<span class="heating-degree">°C</span></div>
                      <div class="heating-label">INDOOR TEMPERATURE</div>
                    </div>
                    <div class="heating-setpoint">
                      <div class="heating-label">HEATING SETPOINT</div>
                      <div class="heating-setpoint-value">${threshold}<span class="heating-degree">°C</span></div>
                      <div class="heating-label">Demo threshold</div>
                    </div>
                  </div>
                  <footer class="heating-footer">
                    <span class="heating-status"><span class="heating-dot" aria-hidden="true"></span>${status}</span>
                    <span>DEMO · TEST VALUES · NOT LIVE</span>
                  </footer>
                </section>`;
            ]]]
