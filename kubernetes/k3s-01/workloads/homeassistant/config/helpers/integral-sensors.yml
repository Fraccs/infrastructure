---
- platform: integration
  # Preserve the legacy entity ID sensor.servers_ups_power_usage and its totals.
  # configuration.yml overrides the displayed name to identify this as energy.
  name: Servers UPS power usage
  source: sensor.nut_01_power_usage
  unit_prefix: k
  unit_time: h
  method: left
  round: 6
  # Accumulate even when the UPS load stays constant for long periods.
  max_sub_interval:
    minutes: 1
