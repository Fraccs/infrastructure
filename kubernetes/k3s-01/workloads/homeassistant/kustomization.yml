---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yml
  - certificate-fraccs-com.yml
  - ingress-route.yml
  - namespace.yml
  - pvc.yml
  - service.yml
  - stateful-set.yml
configMapGenerator:
  - name: homeassistant-dashboards
    namespace: homeassistant
    files:
      - lovelace.yml=dashboards/lovelace.yml
      - heating.yml=dashboards/heating.yml
