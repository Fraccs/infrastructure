---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        checksum/location-aliases: 097049204be845d6096115aa016e660d36a5499e9cbe121bc42b51be342ba9ff
      labels:
        app: homeassistant
    spec:
      # The image allows HA up to 240 seconds to stop services cleanly.
      terminationGracePeriodSeconds: 300
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
          env:
            - name: TZ
              value: Europe/Rome
          # Public frontend response checks HTTP/event-loop health, not every
          # integration. Startup gates readiness and liveness for up to 15 min.
          startupProbe:
            httpGet:
              path: /manifest.json
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Tolerate short event-loop stalls without restarting automations.
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: web
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          ports:
            - name: web
              containerPort: 8123
          volumeMounts:
            - name: homeassistant
              mountPath: /config
            # Overlay only this file; the PVC and its other contents stay mounted.
            # Update checksum/location-aliases when resealing to restart the pod.
            - name: location-aliases
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            # HA requires this runtime filename; the repository uses .yml.
            # The generated ConfigMap hash rolls the pod when this file changes.
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yml
              readOnly: true
            - name: configuration
              mountPath: /config/scripts.yaml
              subPath: scripts.yml
              readOnly: true
            - name: configuration
              mountPath: /config/scenes.yaml
              subPath: scenes.yml
              readOnly: true
            - name: dashboards
              mountPath: /config/git-dashboards
              readOnly: true
            - name: automations
              mountPath: /config/git-automations
              readOnly: true
            - name: helpers
              mountPath: /config/git-helpers
              readOnly: true
      volumes:
        - name: location-aliases
          secret:
            secretName: homeassistant-location-aliases
            defaultMode: 0444
        - name: helpers
          configMap:
            name: homeassistant-helpers
        - name: automations
          configMap:
            name: homeassistant-automations
        - name: configuration
          configMap:
            name: homeassistant-configuration
        - name: dashboards
          configMap:
            name: homeassistant-dashboards
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
