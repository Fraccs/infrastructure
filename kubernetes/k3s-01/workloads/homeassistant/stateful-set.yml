---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        checksum/location-aliases: 097049204be845d6096115aa016e660d36a5499e9cbe121bc42b51be342ba9ff
      labels:
        app: homeassistant
    spec:
      containers:
        - name: homeassistant
          image: docker.io/linuxserver/homeassistant:2026.10.4@sha256:352e928e4db1e4d4946e118b84acdd9a6f95d3e7c206686f8bde0ad609672eba
          # startupProbe:
          #   httpGet:
          #     path: /manifest.json
          #     port: 8123
          #   periodSeconds: 30
          #   failureThreshold: 10
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 512Mi
          #   limits:
          #     cpu: 100m
          #     memory: 1024Mi
          ports:
            - name: web
              containerPort: 8123
          volumeMounts:
            - name: homeassistant
              mountPath: /config
            # Overlay only this file; the PVC and its other contents stay mounted.
            # Update checksum/location-aliases when resealing to restart the pod.
            - name: location-aliases
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
            # HA requires this runtime filename; the repository uses .yml.
            # The generated ConfigMap hash rolls the pod when this file changes.
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yml
              readOnly: true
            - name: configuration
              mountPath: /config/scripts.yml
              subPath: scripts.yml
              readOnly: true
            - name: configuration
              mountPath: /config/scenes.yml
              subPath: scenes.yml
              readOnly: true
            - name: dashboards
              mountPath: /config/git-dashboards
              readOnly: true
            - name: automations
              mountPath: /config/git-automations
              readOnly: true
            - name: helpers
              mountPath: /config/git-helpers
              readOnly: true
      volumes:
        - name: location-aliases
          secret:
            secretName: homeassistant-location-aliases
            defaultMode: 0444
        - name: helpers
          configMap:
            name: homeassistant-helpers
        - name: automations
          configMap:
            name: homeassistant-automations
        - name: configuration
          configMap:
            name: homeassistant-configuration
        - name: dashboards
          configMap:
            name: homeassistant-dashboards
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
