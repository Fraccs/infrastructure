---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
        - name: homeassistant
          image: docker.io/linuxserver/homeassistant:2026.10.4@sha256:352e928e4db1e4d4946e118b84acdd9a6f95d3e7c206686f8bde0ad609672eba
          # startupProbe:
          #   httpGet:
          #     path: /manifest.json
          #     port: 8123
          #   periodSeconds: 30
          #   failureThreshold: 10
          # resources:
          #   requests:
          #     cpu: 10m
          #     memory: 512Mi
          #   limits:
          #     cpu: 100m
          #     memory: 1024Mi
          ports:
            - name: web
              containerPort: 8123
          volumeMounts:
            - name: homeassistant
              mountPath: /config
            # HA requires this runtime filename; the repository uses .yml.
            # The generated ConfigMap hash rolls the pod when this file changes.
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yml
              readOnly: true
            - name: dashboards
              mountPath: /config/git-dashboards
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: homeassistant-configuration
        - name: dashboards
          configMap:
            name: homeassistant-dashboards
        - name: homeassistant
          persistentVolumeClaim:
            claimName: homeassistant
