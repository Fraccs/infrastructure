---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr.fraccs.com`)
      kind: Rule
      services:
        - name: radarr
          kind: Service
          port: 7878
          scheme: http
  tls:
    secretName: radarr-fraccs-com-certificate
