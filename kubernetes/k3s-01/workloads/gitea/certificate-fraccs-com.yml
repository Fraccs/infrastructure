---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitea-fraccs-com
  namespace: gitea
spec:
  secretName: gitea-fraccs-com-certificate
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-acme-letsencrypt-dns01-cloudflare
  dnsNames:
    - gitea.fraccs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
