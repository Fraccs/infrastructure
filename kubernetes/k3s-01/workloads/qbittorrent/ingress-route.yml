---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.fraccs.com`)
      kind: Rule
      services:
        - name: qbittorrent
          kind: Service
          port: 8080
          scheme: http
  tls:
    secretName: qbittorrent-fraccs-com-certificate
