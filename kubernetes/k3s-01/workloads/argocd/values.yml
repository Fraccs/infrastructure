---
crds:
  install: true # -- Install and upgrade CRDs
  keep: true # -- Retain API definitions during recovery or ownership changes
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

global:
  domain: argocd.k3s-01.fraccs.com
  image:
    repository: quay.io/argoproj/argocd
    # Use the pinned chart's appVersion; Renovate updates the chart as one unit.
    imagePullPolicy: IfNotPresent
  tls:
    create: false

dex:
  enabled: false

controller:
  name: application-controller
  replicas: 1
  metrics:
    enabled: true
  extraArgs: ["--redisdb=4"]

redis:
  enabled: false

externalRedis:
  host: "redis.redis.svc.k3s-01.47fc5c.com"
  port: 6379
  existingSecret: argocd-redis

redisSecretInit:
  enabled: false

configs:
  # Auth and RBAC ConfigMaps are managed by external manifests through Argo CD.
  cm:
    create: false
  rbac:
    create: false
  # Preserve the existing emergency password and server-generated signing keys.
  secret:
    createSecret: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  params:
    server.insecure: true

server:
  name: server
  replicas: 1
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  metrics:
    enabled: true
  extraArgs: ["--redisdb=4"]

repoServer:
  name: repo-server
  replicas: 1
  metrics:
    enabled: true
  extraArgs: ["--redisdb=4"]

applicationSet:
  name: applicationset-controller
  replicas: 1
  metrics:
    enabled: true
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

notifications:
  enabled: false
