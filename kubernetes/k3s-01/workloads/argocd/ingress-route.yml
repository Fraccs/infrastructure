---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.k3s-01.fraccs.com`)
      kind: Rule
      services:
        - name: argocd-server
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: argocd-fraccs-com-certificate
