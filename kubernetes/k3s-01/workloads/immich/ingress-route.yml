---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`immich.fraccs.com`)
      kind: Rule
      services:
        - name: immich-server
          kind: Service
          port: 2283
          scheme: http
  tls:
    secretName: immich-fraccs-com-certificate
