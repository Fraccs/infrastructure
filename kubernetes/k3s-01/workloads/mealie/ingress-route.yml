---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mealie
  namespace: mealie
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mealie.fraccs.com`)
      kind: Rule
      services:
        - name: mealie
          kind: Service
          port: 9000
          scheme: http
  tls:
    secretName: mealie-fraccs-com-certificate
