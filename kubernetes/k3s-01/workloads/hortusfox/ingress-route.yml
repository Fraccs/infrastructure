---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hortusfox
  namespace: hortusfox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hortusfox.fraccs.com`)
      kind: Rule
      services:
        - name: hortusfox
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: hortusfox-fraccs-com-certificate
