---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-fraccs-com
  namespace: mosquitto
spec:
  secretName: mosquitto-fraccs-com-certificate
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-acme-letsencrypt-dns01-cloudflare
  dnsNames:
    - mqtt.fraccs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
