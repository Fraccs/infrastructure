---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ghostfolio-egress-dns
  namespace: ghostfolio
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  endpointSelector:
    matchLabels:
      app: ghostfolio
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
      rules:
        dns:
        - matchPattern: '*'
