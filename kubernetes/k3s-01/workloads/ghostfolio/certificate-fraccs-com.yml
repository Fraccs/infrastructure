---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ghostfolio-fraccs-com
  namespace: ghostfolio
spec:
  secretName: ghostfolio-fraccs-com-certificate
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-acme-letsencrypt-dns01-cloudflare
  dnsNames:
  - ghostfolio.fraccs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
