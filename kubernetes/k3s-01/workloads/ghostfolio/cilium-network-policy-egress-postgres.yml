---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ghostfolio-egress-postgres
  namespace: ghostfolio
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  endpointSelector:
    matchLabels:
      app: ghostfolio
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: postgres-cluster
        k8s:cnpg.io/cluster: postgres-cluster
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
