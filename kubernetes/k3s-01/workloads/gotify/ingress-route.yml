---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gotify.fraccs.com`)
      kind: Rule
      services:
        - name: gotify
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: gotify-fraccs-com-certificate
