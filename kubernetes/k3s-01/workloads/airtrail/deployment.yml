---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtrail
  namespace: airtrail
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: airtrail
  template:
    metadata:
      labels:
        app: airtrail
    spec:
      containers:
        - name: airtrail
          image: docker.io/johly/airtrail:v3.14.0@sha256:69ef0a421d6a5f99c06d04ea6b66445a5d1261dd533d6efe3bd8bc3e2dfd018f
          envFrom:
            - configMapRef:
                name: airtrail
            - secretRef:
                name: airtrail
