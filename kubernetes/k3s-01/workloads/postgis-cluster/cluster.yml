---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-cluster
  namespace: postgis-cluster
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.6-system-bookworm@sha256:d0835a8747727d7f66506866168a7b242d97544884d27cf8316f6345dfa51f7d
  storage:
    size: 4Gi
    storageClass: longhorn-crypto-global-single-replica
  postgresql:
    synchronous:
      method: any
      number: 1
  managed:
    roles:
    - name: dawarich
      login: true
      passwordSecret:
        name: dawarich-role
