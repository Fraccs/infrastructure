---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: voice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      containers:
        - name: piper
          image: docker.io/rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
          args:
            - "--voice"
            - "it_IT-serena-high"
            - "--uri"
            - "tcp://0.0.0.0:10200"
            - "--data-dir"
            - "/data"
            - "--download-dir"
            - "/data"
          ports:
            - name: wyoming
              containerPort: 10200
              protocol: TCP
          volumeMounts:
            - name: piper-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: piper-data
          persistentVolumeClaim:
            claimName: piper-data
