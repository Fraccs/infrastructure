---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flower
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`flower.fraccs.com`)
      kind: Rule
      services:
        - name: flower
          kind: Service
          port: 5555
          scheme: http
  tls:
    secretName: flower-fraccs-com-certificate
