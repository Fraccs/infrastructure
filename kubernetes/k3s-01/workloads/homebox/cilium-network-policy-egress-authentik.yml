---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homebox-egress-authentik
  namespace: homebox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homebox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
