---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-network-policy-ingress-wger-celery-beat
  namespace: wger
spec:
  description: 'Celery beat: no normal pod ingress; allow host/node traffic for initial
    compatibility'
  endpointSelector:
    matchLabels:
      app: wger-celery-beat
  ingress:
  - fromEntities:
    - host
    - remote-node
