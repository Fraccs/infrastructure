---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-flower
  namespace: monitoring
  labels:
    app: wger-flower
    application: wger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wger-flower
  template:
    metadata:
      labels:
        app: wger-flower
        application: wger
    spec:
      serviceAccountName: wger-flower
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flower
          image: docker.io/mher/flower:2.2.0@sha256:29bebd8e7e04371162ab80cb3591e5a72808c71323b88b4ceec20799696b5a9b
          command: ["celery"]
          args: ["flower", "--address=0.0.0.0", "--port=5555"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: wger-flower
                  key: CELERY_BROKER_URL
            - name: FLOWER_READ_ONLY
              value: "true"
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
          startupProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
