---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wger
  namespace: wger
data:
  TIME_ZONE: "Europe/Rome"
  TZ: "Europe/Rome"
  ALLOWED_HOSTS: "wger.fraccs.com"
  CSRF_TRUSTED_ORIGINS: "https://wger.fraccs.com"
  X_FORWARDED_PROTO_HEADER_SET: "True"
  USE_X_FORWARDED_HOST: "True"

  POWERSYNC_URL_PATH: "ps"

  MEDIA_URL: "/media/"
  STATIC_URL: "/static/"
  WGER_PORT: "8000"

  WGER_INSTANCE: "https://wger.de"
  ALLOW_REGISTRATION: "True"
  ALLOW_GUEST_USERS: "False"
  ALLOW_UPLOAD_VIDEOS: "True"
  MIN_ACCOUNT_AGE_TO_TRUST: "14"

  SYNC_EXERCISES_CELERY: "True"
  SYNC_EXERCISE_IMAGES_CELERY: "True"
  SYNC_EXERCISE_VIDEOS_CELERY: "True"
  SYNC_INGREDIENTS_CELERY: "True"
  DOWNLOAD_INGREDIENTS_FROM: "WGER"
  USE_CELERY: "True"

  DJANGO_DB_ENGINE: "django.db.backends.postgresql"
  DJANGO_DB_DATABASE: "wger"
  DJANGO_DB_USER: "wger"
  DJANGO_DB_HOST: "postgres-cluster-rw.postgres-cluster.svc.k3s-01.47fc5c.com"
  DJANGO_DB_PORT: "5432"
  DJANGO_PERFORM_MIGRATIONS: "True"

  DJANGO_CACHE_BACKEND: "django_redis.cache.RedisCache"
  DJANGO_CACHE_LOCATION: "redis://redis.redis.svc.k3s-01.47fc5c.com:6379/16"
  DJANGO_CACHE_TIMEOUT: "1296000"
  DJANGO_CACHE_CLIENT_CLASS: "django_redis.client.DefaultClient"

  AXES_ENABLED: "True"
  AXES_FAILURE_LIMIT: "10"
  AXES_COOLOFF_TIME: "30"
  AXES_HANDLER: "axes.handlers.cache.AxesCacheHandler"
  AXES_LOCKOUT_PARAMETERS: "ip_address"
  AXES_IPWARE_PROXY_COUNT: "1"
  AXES_IPWARE_META_PRECEDENCE_ORDER: "HTTP_X_FORWARDED_FOR,REMOTE_ADDR"

  DJANGO_DEBUG: "False"
  WGER_USE_GUNICORN: "True"
  EXERCISE_CACHE_TTL: "18000"
  SITE_URL: "https://wger.fraccs.com"

  ACCESS_TOKEN_LIFETIME: "10"
  REFRESH_TOKEN_LIFETIME: "24"

  LOG_LEVEL_PYTHON: "INFO"
  USE_RECAPTCHA: "False"
  DJANGO_CLEAR_STATIC_FIRST: "False"
  NUMBER_OF_PROXIES: "2" # Traefik -> nginx -> wger; verify against real chain
  GUNICORN_CMD_ARGS: "--workers 3 --threads 2 --worker-class gthread --timeout 240"

  # Email
  # https://docs.djangoproject.com/en/4.1/topics/email/#smtp-backend
  # ENABLE_EMAIL: False
  # EMAIL_HOST: email.example.com
  # EMAIL_PORT: 587
  # EMAIL_HOST_USER: username
  # EMAIL_HOST_PASSWORD: password
  # EMAIL_USE_TLS: True
  # EMAIL_USE_SSL: False
  # FROM_EMAIL: "'wger Workout Manager <wger@example.com>'"

  # Set your name and email to be notified if an internal server error occurs.
  # Needs a working email configuration
  # DJANGO_ADMINS: your name,email@example.com
