---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden.fraccs.com`)
      kind: Rule
      services:
        - name: vaultwarden
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: vaultwarden-fraccs-com-certificate
