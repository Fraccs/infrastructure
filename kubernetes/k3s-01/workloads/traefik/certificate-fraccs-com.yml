---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-fraccs-com
  namespace: kube-system
spec:
  secretName: traefik-fraccs-com-certificate
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-acme-letsencrypt-dns01-cloudflare
  dnsNames:
    - traefik.k3s-01.fraccs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
