---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
    spec:
      containers:
        - name: dawarich
          image: docker.io/freikin/dawarich:1.16.0@sha256:b533e6eac4464d55479d030229cf9487f338972cdb88924e8060ca759d0e28b8
          command:
            - "web-entrypoint.sh"
          args:
            - "bin/rails"
            - "server"
            - "-p"
            - "3000"
            - "-b"
            - "::"
          volumeMounts:
            - name: dawarich
              mountPath: /var/app/public
              subPath: public/
            - name: dawarich
              mountPath: /var/app/tmp/imports/watched
              subPath: watched/
            - name: dawarich
              mountPath: /var/app/storage
              subPath: storage/
          envFrom:
            - configMapRef:
                name: dawarich-shared
            - configMapRef:
                name: dawarich-dawarich
            - secretRef:
                name: dawarich
      volumes:
        - name: dawarich
          persistentVolumeClaim:
            claimName: dawarich
