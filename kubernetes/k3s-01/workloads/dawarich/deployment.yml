---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
    spec:
      containers:
        - name: dawarich
          image: docker.io/freikin/dawarich:1.19.0@sha256:d9385242202ae385a5d8064f41a59a0b58218399e60e7e499d2a6afb449bc304
          command:
            - "web-entrypoint.sh"
          args:
            - "bin/rails"
            - "server"
            - "-p"
            - "3000"
            - "-b"
            - "::"
          volumeMounts:
            - name: dawarich
              mountPath: /var/app/public
              subPath: public/
            - name: dawarich
              mountPath: /var/app/tmp/imports/watched
              subPath: watched/
            - name: dawarich
              mountPath: /var/app/storage
              subPath: storage/
          envFrom:
            - configMapRef:
                name: dawarich-shared
            - configMapRef:
                name: dawarich-dawarich
            - secretRef:
                name: dawarich
      volumes:
        - name: dawarich
          persistentVolumeClaim:
            claimName: dawarich
