---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.fraccs.com`)
      kind: Rule
      services:
        - name: authentik-server
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: authentik-fraccs-com-certificate
