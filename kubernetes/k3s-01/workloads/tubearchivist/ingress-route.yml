---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tubearchivist
  namespace: tubearchivist
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tubearchivist.fraccs.com`)
      kind: Rule
      services:
        - name: tubearchivist
          kind: Service
          port: 8000
          scheme: http
  tls:
    secretName: tubearchivist-fraccs-com-certificate
