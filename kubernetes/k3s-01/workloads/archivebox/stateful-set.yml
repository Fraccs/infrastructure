---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: archivebox
  namespace: archivebox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archivebox
  template:
    metadata:
      labels:
        app: archivebox
    spec:
      containers:
        - name: archivebox
          image: docker.io/archivebox/archivebox:0.9.70@sha256:8c21bb233130d86963e2ffab143264dfb8908c966a12a00f2180bb88e6f6305a
          volumeMounts:
            - name: archivebox-data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: archivebox
      volumes:
        - name: archivebox-data
          persistentVolumeClaim:
            claimName: archivebox-data-encrypted
