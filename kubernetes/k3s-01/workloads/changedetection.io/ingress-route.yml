---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cdio
  namespace: cdio
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cdio.fraccs.com`)
      kind: Rule
      services:
        - name: cdio
          kind: Service
          port: 5000
          scheme: http
  tls:
    secretName: cdio-fraccs-com-certificate
