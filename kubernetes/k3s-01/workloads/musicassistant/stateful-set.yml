---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: musicassistant
  namespace: musicassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musicassistant
  template:
    metadata:
      labels:
        app: musicassistant
    spec:
      containers:
        - name: musicassistant
          image: ghcr.io/music-assistant/server:2.10.8@sha256:661e88bea76a9e79f38feca791f6c7373376ab60766ee01f56b66418ca243b68
          volumeMounts:
            - name: musicassistant
              mountPath: /data
      volumes:
        - name: musicassistant
          persistentVolumeClaim:
            claimName: musicassistant
