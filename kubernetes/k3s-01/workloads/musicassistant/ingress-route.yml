---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: musicassistant
  namespace: musicassistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`music.fraccs.com`)
      kind: Rule
      services:
        - name: musicassistant
          kind: Service
          port: 8095
          scheme: http
  tls:
    secretName: musicassistant-fraccs-com-certificate
