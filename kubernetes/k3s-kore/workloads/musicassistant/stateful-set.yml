---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: musicassistant
  namespace: musicassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musicassistant
  template:
    metadata:
      labels:
        app: musicassistant
    spec:
      containers:
        - name: musicassistant
          image: ghcr.io/music-assistant/server:2.10.11@sha256:b14d5c1c93d776f33b9670a3c6febe3f072566d7b2f4f431a09dcca79bd8ac05
          volumeMounts:
            - name: musicassistant
              mountPath: /data
      volumes:
        - name: musicassistant
          persistentVolumeClaim:
            claimName: musicassistant
