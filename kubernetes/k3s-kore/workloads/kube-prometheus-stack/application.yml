---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  syncPolicy:
    automated:
      enabled: false
      allowEmpty: false
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: http://gitea-http.gitea.svc.k3s-01.47fc5c.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/k3s-kore/workloads/kube-prometheus-stack
      directory:
        exclude: '{application*.yml,values.yml}'
    - repoURL: http://gitea-http.gitea.svc.k3s-01.47fc5c.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts/
      chart: kube-prometheus-stack
      targetRevision: 70.10.0
      helm:
        valueFiles:
          - $values/kubernetes/k3s-kore/workloads/kube-prometheus-stack/values.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
