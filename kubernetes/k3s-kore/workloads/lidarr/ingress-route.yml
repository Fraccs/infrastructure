---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lidarr.fraccs.com`)
      kind: Rule
      services:
        - name: lidarr
          kind: Service
          port: 8686
          scheme: http
  tls:
    secretName: lidarr-fraccs-com-certificate
