---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.k3s-01.fraccs.com`)
      kind: Rule
      services:
        - name: longhorn-frontend
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: longhorn-fraccs-com-certificate
