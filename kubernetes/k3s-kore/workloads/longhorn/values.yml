---
persistence:
  defaultClass: false # longhorn-crypto-global is the cluster default.
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  reclaimPolicy: Retain
  migratable: false
  recurringJobSelector:
    enable: false
  backingImage:
    enable: false
  defaultDiskSelector:
    enable: false
  removeSnapshotsDuringFilesystemTrim: ignored
  dataEngine: v1
  backupTargetName: default

defaultBackupStore:
  backupTarget: nfs://nfs.infra.fraccs.com:/mnt/pool-0/volumes/generic/backups
  nfsOptions: vers=4.1,noresvport

defaultSettings:
  defaultDataPath: /mnt/longhorn
  storageOverProvisioningPercentage: "100"
  storageMinimalAvailablePercentage: "5"
  storageReservedPercentageForDefaultDisk: "0"
  upgradeChecker: false
  defaultReplicaCount: 3
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  allowCollectingLonghornUsageMetrics: false

networkPolicies:
  # Kore manages network policies with Cilium.
  enabled: false
  restrictInternalTraffic: false

httproute:
  enabled: false
