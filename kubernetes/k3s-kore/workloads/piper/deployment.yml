---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: voice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      containers:
        - name: piper
          image: docker.io/rhasspy/wyoming-piper:2.5.3@sha256:0f4598a8f8a984275f67c066d7cd96d26ef2601947d0372b8f32c82ae18fb7cd
          args:
            - "--voice"
            - "it_IT-serena-high"
            - "--uri"
            - "tcp://0.0.0.0:10200"
            - "--data-dir"
            - "/data"
            - "--download-dir"
            - "/data"
          ports:
            - name: wyoming
              containerPort: 10200
              protocol: TCP
          volumeMounts:
            - name: piper-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: piper-data
          persistentVolumeClaim:
            claimName: piper-data
