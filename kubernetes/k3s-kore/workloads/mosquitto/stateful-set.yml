---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 32Mi
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: mosquitto
              mountPath: /mosquitto/config
              subPath: config/
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mosquitto
              mountPath: /mosquitto/data
              subPath: data/
            - name: mosquitto
              mountPath: /mosquitto/log
              subPath: log/
      volumes:
        - name: mosquitto
          persistentVolumeClaim:
            claimName: mosquitto-encrypted
        - name: mosquitto-config
          configMap:
            name: mosquitto
