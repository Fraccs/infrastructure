---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plugin-barman-cloud
      app.kubernetes.io/instance: plugin-barman-cloud
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: cloudnative-pg
        app.kubernetes.io/instance: cnpg-operator
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: '8081'
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
    - ports:
      - port: '6443'
        protocol: TCP
