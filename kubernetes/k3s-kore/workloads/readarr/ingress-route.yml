---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: readarr
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`readarr.fraccs.com`)
      kind: Rule
      services:
        - name: readarr
          kind: Service
          port: 8787
          scheme: http
  tls:
    secretName: readarr-fraccs-com-certificate
