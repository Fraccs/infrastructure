---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: archivebox
  namespace: archivebox
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`archivebox.fraccs.com`)
      kind: Rule
      services:
        - name: archivebox
          kind: Service
          port: 5797
          scheme: http
  tls:
    secretName: archivebox-fraccs-com-certificate
