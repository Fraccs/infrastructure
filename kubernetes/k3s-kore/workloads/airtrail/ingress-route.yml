---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airtrail
  namespace: airtrail
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`airtrail.fraccs.com`)
      kind: Rule
      services:
        - name: airtrail
          kind: Service
          port: 3000
          scheme: http
  tls:
    secretName: airtrail-fraccs-com-certificate
