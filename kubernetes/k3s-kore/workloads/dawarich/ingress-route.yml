---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dawarich
  namespace: dawarich
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dawarich.fraccs.com`)
      kind: Rule
      services:
        - name: dawarich
          kind: Service
          port: 3000
          scheme: http
  tls:
    secretName: dawarich-fraccs-com-certificate
