---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarr-fraccs-com
  namespace: torrenting
spec:
  secretName: sonarr-fraccs-com-certificate
  issuerRef:
    kind: ClusterIssuer
    name: cert-manager-acme-letsencrypt-dns01-cloudflare
  dnsNames:
    - sonarr.fraccs.com
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
