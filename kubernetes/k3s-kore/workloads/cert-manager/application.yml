---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  syncPolicy:
    automated:
      enabled: false
      allowEmpty: false
      prune: true
  sources:
    - repoURL: http://gitea-http.gitea.svc.k3s-01.47fc5c.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/k3s-kore/workloads/cert-manager
      directory:
        exclude: '{application*.yml,values.yml}'
    - repoURL: http://gitea-http.gitea.svc.k3s-01.47fc5c.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://charts.jetstack.io/
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles:
          - $values/kubernetes/k3s-kore/workloads/cert-manager/values.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
