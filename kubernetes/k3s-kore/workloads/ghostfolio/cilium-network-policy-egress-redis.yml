---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ghostfolio-egress-redis
  namespace: ghostfolio
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  endpointSelector:
    matchLabels:
      app: ghostfolio
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: redis
        app: redis
    toPorts:
    - ports:
      - port: '6379'
        protocol: TCP
