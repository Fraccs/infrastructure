---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghostfolio
  namespace: argocd
spec:
  project: default
  syncPolicy:
    syncOptions:
    - PruneLast=true
  source:
    repoURL: http://gitea-http.gitea.svc.k3s-01.47fc5c.com:3000/fraccs/infrastructure.git
    targetRevision: HEAD
    path: kubernetes/k3s-kore/workloads/ghostfolio
    directory:
      exclude: application.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: ghostfolio
