---
apiVersion: v1
kind: LimitRange
metadata:
  name: gitea-actions
  namespace: gitea-actions
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
