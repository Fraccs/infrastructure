---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitea-actions-egress-traefik
  namespace: gitea-actions
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: '8443'
              protocol: TCP
