---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitea-actions-egress-kube-apiserver
  namespace: gitea-actions
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gitea-actions
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
            - port: '443'
              protocol: TCP
