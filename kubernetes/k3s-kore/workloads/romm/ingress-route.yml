---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: romm
  namespace: romm
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`romm.fraccs.com`)
      kind: Rule
      services:
        - name: romm
          kind: Service
          port: 8090
          scheme: http
  tls:
    secretName: romm-fraccs-com-certificate
