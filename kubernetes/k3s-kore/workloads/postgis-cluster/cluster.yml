---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgis-cluster
  namespace: postgis-cluster
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.6-system-bookworm@sha256:d0835a8747727d7f66506866168a7b242d97544884d27cf8316f6345dfa51f7d
  storage:
    size: 4Gi
    storageClass: longhorn-crypto-global-single-replica
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      min_wal_size: "80MB"
      max_wal_size: "256MB"
      checkpoint_timeout: "5min"
      wal_keep_size: "64MB"
      max_slot_wal_keep_size: "512MB"
      wal_compression: "on"
  managed:
    roles:
    - name: dawarich
      login: true
      passwordSecret:
        name: dawarich-role
