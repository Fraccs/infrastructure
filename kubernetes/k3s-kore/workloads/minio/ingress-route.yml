---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio
  namespace: minio
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.fraccs.com`)
      kind: Rule
      services:
        - name: minio-console
          kind: Service
          port: 9090
          scheme: http
  tls:
    secretName: minio-fraccs-com-certificate
