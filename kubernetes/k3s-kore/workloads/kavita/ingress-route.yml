---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kavita
  namespace: kavita
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kavita.fraccs.com`)
      kind: Rule
      services:
        - name: kavita
          kind: Service
          port: 5000
          scheme: http
  tls:
    secretName: kavita-fraccs-com-certificate
