---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          # resources:
          #   requests:
          #     cpu: 1m
          #     memory: 96Mi
          #   limits:
          #     cpu: 15m
          #     memory: 160Mi
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: homepage-files
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/proxmox.yaml
              subPath: proxmox.yaml
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/custom.css
              subPath: custom.css
              readOnly: true
            - name: homepage-files
              mountPath: /app/config/custom.js
              subPath: custom.js
              readOnly: true
            - name: logs
              mountPath: /app/config/logs
          envFrom:
            - configMapRef:
                name: homepage
            - secretRef:
                name: homepage
            - secretRef:
                name: homepage-links
      volumes:
        - name: homepage-files
          configMap:
            name: homepage-files
        - name: logs
          emptyDir: {}
