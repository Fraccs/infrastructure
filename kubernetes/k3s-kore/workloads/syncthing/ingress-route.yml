---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: syncthing
  namespace: syncthing
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`syncthing.fraccs.com`)
      kind: Rule
      services:
        - name: syncthing
          kind: Service
          port: 8384
          scheme: http
  tls:
    secretName: syncthing-fraccs-com-certificate
