---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homebox-egress-database
  namespace: homebox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homebox
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: postgres-cluster
            k8s:cnpg.io/cluster: postgres-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
