---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-network-policy-egress-wger-powersync
  namespace: wger
spec:
  description: 'PowerSync: CoreDNS, PostgreSQL source/storage and Django JWKS 8000/TCP'
  endpointSelector:
    matchLabels:
      app: wger-powersync
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: postgres-cluster
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: wger
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
