---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-celery-worker
  namespace: wger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wger-celery-worker
  template:
    metadata:
      labels:
        app: wger-celery-worker
    spec:
      containers:
      - name: celery-worker
        image: docker.io/wger/server:2.7.0@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
        command:
        - /start-worker
        envFrom:
        - configMapRef:
            name: wger
        - secretRef:
            name: wger
        volumeMounts:
        - name: wger-media
          mountPath: /home/wger/media/
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: wger-media
        persistentVolumeClaim:
          claimName: wger-media
      serviceAccountName: wger-celery-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
