---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-network-policy-ingress-wger-powersync
  namespace: wger
spec:
  description: 'PowerSync: allow Traefik 8080/TCP, monitoring scrapes 9090/TCP and
    node probes'
  endpointSelector:
    matchLabels:
      app: wger-powersync
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
