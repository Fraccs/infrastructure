---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wger
  namespace: wger
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wger.fraccs.com`) && (Path(`/ps`) || PathPrefix(`/ps/`))
      kind: Rule
      priority: 100
      middlewares:
        - namespace: wger
          name: wger-powersync
      services:
        - name: wger-powersync
          kind: Service
          port: 8080
          scheme: http
          responseForwarding:
            flushInterval: 1ms
    - match: Host(`wger.fraccs.com`)
      kind: Rule
      priority: 1
      services:
        - name: wger-nginx
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: wger-fraccs-com-certificate
