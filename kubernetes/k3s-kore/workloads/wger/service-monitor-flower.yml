---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wger-flower
  namespace: monitoring
  labels:
    app: wger-flower
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: wger-flower
  targetLabels:
    - application
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
