---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-network-policy-egress-wger-celery-beat
  namespace: wger
spec:
  description: 'Celery beat: CoreDNS, PostgreSQL and Redis only'
  endpointSelector:
    matchLabels:
      app: wger-celery-beat
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: postgres-cluster
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: redis
    toPorts:
    - ports:
      - port: '6379'
        protocol: TCP
