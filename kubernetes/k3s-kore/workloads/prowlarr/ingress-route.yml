---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: torrenting
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prowlarr.fraccs.com`)
      kind: Rule
      services:
        - name: prowlarr
          kind: Service
          port: 9696
          scheme: http
  tls:
    secretName: prowlarr-fraccs-com-certificate
