---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: endurain
  namespace: endurain
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`endurain.fraccs.com`)
      kind: Rule
      services:
        - name: endurain
          kind: Service
          port: 8080
          scheme: http
  tls:
    secretName: endurain-fraccs-com-certificate
