---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hubble.k3s-01.fraccs.com`)
      kind: Rule
      services:
        - name: hubble-ui
          kind: Service
          port: 80
          scheme: http
  tls:
    secretName: hubble-fraccs-com-certificate
