---
# Nintendo Switch / LineageOS: responsive 1280x720 landscape target.
# Live indoor temperature from the dining room sensor.
button_card_templates:
  heating_i18n:
    variables:
      i18n: |
        [[[
          const language = hass.locale?.language || hass.language || 'en';
          const italian = language.toLowerCase().split('-')[0] === 'it';
          return {
            locale: italian ? 'it-IT' : 'en-GB',
            title: italian ? 'CASA / RISCALDAMENTO' : 'HOME / HEATING',
            browse: italian ? 'Apri Home Assistant' : 'Browse Home Assistant',
            temperature: italian ? 'TEMPERATURA INTERNA' : 'INDOOR TEMPERATURE',
            heating: italian ? 'RISCALDAMENTO ATTIVO' : 'HEATING ACTIVE',
            heatingUnknown: italian ? 'STATO RISCALDAMENTO NON DISPONIBILE' : 'HEATING STATUS UNAVAILABLE'
          };
        ]]]

kiosk_mode:
  user_settings:
    - users:
        - Orbit
      kiosk: true

views:
  - title: Heating
    path: heating
    icon: mdi:home-thermometer
    type: panel
    cards:
      - type: custom:button-card
        template: heating_i18n
        entity: sensor.sala_da_pranzo_satellite_01_temperatura
        triggers_update:
          - sensor.sala_da_pranzo_satellite_01_temperatura
          - switch.cucina_shelly_1_mini_01
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - --burner-opacity: "[[[ return hass.states?.['switch.cucina_shelly_1_mini_01']?.state === 'on' ? 1 : 0; ]]]"
            - --burner-motion: "[[[ return hass.states?.['switch.cucina_shelly_1_mini_01']?.state === 'on' ? 'running' : 'paused'; ]]]"
            - position: relative
            # kiosk-mode supplies zero header height when hiding HA navigation.
            - height: calc(100vh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px))
            - margin: 0
            - padding: 0
            - box-sizing: border-box
            - background: transparent
            - border: 0
            - border-radius: 0
            - box-shadow: none
            - color: var(--primary-text-color)
            - font-family: system-ui, -apple-system, sans-serif
          grid:
            - grid-template-areas: '"header" "temperature"'
            - grid-template-columns: minmax(0, 1fr)
            - grid-template-rows: auto minmax(0, 1fr)
            - height: 100%
            - box-sizing: border-box
            - padding: clamp(16px, 3vw, 40px)
            - padding-bottom: max(16px, env(safe-area-inset-bottom, 0px))
            - gap: 16px
          custom_fields:
            burner:
              - position: absolute
              - inset: auto 0 0 0
              - height: clamp(48px, 14vh, 110px)
              - pointer-events: none
              - overflow: hidden
              - opacity: var(--burner-opacity, 0)
              - transition: opacity 700ms ease
            burner_status:
              - position: absolute
              - left: 0
              - right: 0
              - bottom: calc(clamp(48px, 14vh, 110px) + 12px)
              - pointer-events: none
              - white-space: normal
              - padding: 0 16px
            header:
              - min-width: 0
              - text-align: left
            temperature:
              # Center the main number independently of the header and unit.
              - position: absolute
              - grid-area: auto
              - left: 50%
              - top: 50%
              - transform: translate(-50%, -50%)
              # button-card adds .ellipsis (overflow: hidden) to this wrapper.
              # The unit, hundredths and label extend outside the number box.
              - overflow: visible
              - min-width: 0
              - justify-self: center
              - align-self: center
              - text-align: center
        extra_styles: |
          :host { width: 100%; max-width: none !important; }
          @supports (height: 100dvh) {
            #card { height: calc(100dvh - var(--kiosk-header-height, var(--header-height, 56px)) - var(--safe-area-inset-top, 0px)); }
          }
          .heating-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; white-space: normal;
          }
          .heating-title { font-size: clamp(12px, 1.5vw, 18px); letter-spacing: .1em; font-weight: 650; }
          .heating-exit {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 48px; padding: 0 16px; box-sizing: border-box;
            border: 1px solid var(--divider-color, #777); border-radius: 12px;
            color: var(--primary-text-color); text-decoration: none;
            font-size: 14px; font-weight: 600; touch-action: manipulation;
            pointer-events: auto; cursor: pointer;
          }
          .heating-exit:focus-visible { outline: 3px solid var(--primary-color, #03a9f4); outline-offset: 3px; }
          .heating-temperature { position: relative; }
          .heating-value {
            position: relative; color: #fff;
            font-size: clamp(80px, min(20vw, 38vh), 250px);
            line-height: 1.05; letter-spacing: -.065em; font-weight: 300;
            font-variant-numeric: tabular-nums; white-space: nowrap;
          }
          .heating-degree, .heating-precision {
            grid-template-columns: .45em .75em;
            justify-items: center;
            font-size: .35em; line-height: 1; letter-spacing: 0;
          }
          .heating-degree {
            position: absolute; left: calc(100% + .12em); top: .22em;
            display: grid;
          }
          .heating-degree > span:first-child { justify-self: start; }
          .heating-precision {
            /* Keep the small digit on the number's text baseline, not its
               line-box bottom. Zero width preserves main-number centering. */
            display: inline-grid; vertical-align: baseline; width: 0;
            position: relative; left: .12em; overflow: visible;
          }
          .heating-hundredths {
            grid-column: 1; justify-self: start;
            font-size: 1.15em; font-weight: 700; opacity: .45;
          }
          .heating-label {
            position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%);
            width: max-content; max-width: 80vw;
            font-size: clamp(11px, 1.3vw, 16px); letter-spacing: .1em;
            color: var(--secondary-text-color); white-space: normal;
          }
          .gas-burner { position: relative; height: 100%; width: 100%; }
          .gas-glow {
            position: absolute; inset: 15% 0 0;
            background: radial-gradient(ellipse at 50% 120%, #008cff70, transparent 72%);
          }
          .gas-rail {
            position: absolute; inset: auto 0 0; height: 7px;
            background: linear-gradient(0deg, #087adf, #79dfffaa, transparent);
          }
          .gas-jets { position: absolute; inset: 0; display: flex; padding: 0 1%; }
          .gas-jet { position: relative; flex: 1; }
          .gas-flame {
            position: absolute; bottom: 3px; left: 50%;
            width: clamp(6px, 1.8vw, 24px); max-width: 80%; height: var(--jet-height);
            border-radius: 50% 50% 35% 35% / 90% 90% 20% 20%;
            background: linear-gradient(0deg, #c5f7ff 0%, #40bfff 20%, #1268f2 65%, #164bea20 100%);
            transform-origin: 50% 100%;
            animation: gas-sway var(--jet-duration) ease-in-out var(--jet-delay) infinite alternate;
            animation-play-state: var(--burner-motion, paused);
          }
          .gas-flame::after {
            content: ''; position: absolute; bottom: 0; left: 28%; width: 44%; height: 48%;
            border-radius: 50% 50% 25% 25% / 95% 95% 15% 15%;
            background: linear-gradient(0deg, #efffff, #8aeaff 65%, #37b8ff30);
          }
          @keyframes gas-sway {
            0% { transform: translateX(-50%) scale(.92, .86) rotate(-2deg); opacity: .78; }
            50% { transform: translateX(-50%) scale(1, 1) rotate(1deg); opacity: 1; }
            100% { transform: translateX(-50%) scale(.95, .92) rotate(2deg); opacity: .88; }
          }
          .burner-status {
            font-size: clamp(12px, 1.5vw, 18px); font-weight: 650; letter-spacing: .12em;
            color: #9cddff;
          }
          .burner-status-unknown { color: #d9bd87; }
          @media (prefers-reduced-motion: reduce) {
            #burner { transition: none !important; }
            .gas-flame { animation: none; transform: translateX(-50%); opacity: .9; }
          }
        custom_fields:
          # Keep flame markup constant across sensor updates so animations do
          # not restart. CSS state changes fade the same layer in/out.
          burner: |
            [[[
              const jets = Array.from({length: 28}, (_, i) =>
                `<span class="gas-jet"><span class="gas-flame" style="--jet-height:${62 + (i * 13 % 29)}%;--jet-duration:${2.4 + (i % 7) * .23}s;--jet-delay:-${(i * .37).toFixed(2)}s"></span></span>`
              ).join('');
              return `<div class="gas-burner" aria-hidden="true"><div class="gas-glow"></div><div class="gas-jets">${jets}</div><div class="gas-rail"></div></div>`;
            ]]]
          burner_status: |
            [[[
              const state = hass.states?.['switch.cucina_shelly_1_mini_01']?.state;
              if (state === 'off') return '';
              const active = state === 'on';
              return `<div role="status" class="burner-status${active ? '' : ' burner-status-unknown'}">${active ? variables.i18n.heating : variables.i18n.heatingUnknown}</div>`;
            ]]]
          header: |
            [[[
              const t = variables.i18n;
              return `<header class="heating-header">
                <span class="heating-title">${t.title}</span>
                <a class="heating-exit" href="/overview-dashboard/default_view?disable_km"
                   onclick="event.stopPropagation()" ontouchend="event.stopPropagation()"
                   onkeydown="event.stopPropagation()">${t.browse}</a>
              </header>`;
            ]]]
          temperature: |
            [[[
              const value = entity?.state;
              const number = Number(value);
              const valid = value !== null && value !== undefined && String(value).trim() !== '' && Number.isFinite(number);
              // Round once to hundredths, then split: avoid inconsistent carry
              // between the large tenths and small hundredths (19.999 -> 20.00).
              const parts = valid ? new Intl.NumberFormat(variables.i18n.locale, {
                minimumFractionDigits: 2, maximumFractionDigits: 2
              }).formatToParts(number) : [];
              const formatted = valid ? parts.map(part => part.type === 'fraction' ? part.value[0] : part.value).join('') : '—';
              const hundredths = valid ? parts.find(part => part.type === 'fraction').value[1] : '';
              const spoken = valid ? parts.map(part => part.value).join('') : '—';
              return `<div class="heating-temperature">
                <div class="heating-value" role="img" aria-label="${spoken} °C">
                  <span class="heating-main" aria-hidden="true">${formatted}</span>${valid ? `<span class="heating-precision" aria-hidden="true"><span class="heating-hundredths">${hundredths}</span></span>` : ''}<span class="heating-degree" aria-hidden="true"><span>°</span><span class="heating-celsius">C</span></span>
                </div>
                <div class="heating-label">${variables.i18n.temperature}</div>
              </div>`;
            ]]]
