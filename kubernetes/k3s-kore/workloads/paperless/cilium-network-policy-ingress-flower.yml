---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-network-policy-ingress-paperless-flower
  namespace: monitoring
spec:
  description: 'Flower: allow Traefik UI and Prometheus scrapes on
    5555/TCP; node probes'
  endpointSelector:
    matchLabels:
      app: paperless-flower
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:app.kubernetes.io/name: traefik
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        k8s:app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '5555'
        protocol: TCP
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '5555'
        protocol: TCP
