---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: paperless
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`paperless.fraccs.com`)
      kind: Rule
      services:
        - name: paperless
          kind: Service
          port: 8000
          scheme: http
  tls:
    secretName: paperless-fraccs-com-certificate
