---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  syncPolicy:
    automated:
      enabled: true
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: http://gitea-http.gitea.svc.k3s-kore.it-mi-vt.infra.fraccs.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      path: kubernetes/k3s-kore/workloads/traefik
      directory:
        exclude: '{application*.yml,values.yml}'
    - repoURL: http://gitea-http.gitea.svc.k3s-kore.it-mi-vt.infra.fraccs.com:3000/fraccs/infrastructure.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 39.0.9
      helm:
        valueFiles:
          - $values/kubernetes/k3s-kore/workloads/traefik/values.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
