---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freshrss
  namespace: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      initContainers:
        - name: configure-http-auth
          image: docker.io/freshrss/freshrss:1.31.0@sha256:31b0acfcb8e11600aa6ce697ff8d9d7ea620c85d766e5e764f487b433d20d066
          command: ["php", "/var/www/FreshRSS/cli/reconfigure.php", "--auth-type=http_auth"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: freshrss
              mountPath: /var/www/FreshRSS/data
              subPath: data/
      containers:
        - name: freshrss
          image: docker.io/freshrss/freshrss:1.31.0@sha256:31b0acfcb8e11600aa6ce697ff8d9d7ea620c85d766e5e764f487b433d20d066
          ports:
            - containerPort: 80
          volumeMounts:
            - name: freshrss
              mountPath: /var/www/FreshRSS/data
              subPath: data/
            - name: freshrss
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions/
          envFrom:
            - configMapRef:
                name: freshrss
            - secretRef:
                name: freshrss
      volumes:
        - name: freshrss
          persistentVolumeClaim:
            claimName: freshrss
