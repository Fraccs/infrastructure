---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkding
  namespace: linkding
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`linkding.fraccs.com`)
      kind: Rule
      services:
        - name: linkding
          kind: Service
          port: 9090
          scheme: http
  tls:
    secretName: linkding-fraccs-com-certificate
