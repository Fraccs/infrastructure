---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gitea.fraccs.com`)
      kind: Rule
      services:
        - name: gitea-http
          kind: Service
          port: 3000
          scheme: http
  tls:
    secretName: gitea-fraccs-com-certificate
