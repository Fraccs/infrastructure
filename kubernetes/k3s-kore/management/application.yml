---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kore-applications
  namespace: argocd
  labels:
    gitops.fraccs.com/role: root
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.k3s-kore.it-mi-vt.infra.fraccs.com:3000/fraccs/infrastructure.git
    targetRevision: HEAD
    path: kubernetes/k3s-kore
    directory:
      recurse: true
      include: '{management/application.yml,workloads/*/application.yml}'
      # Glob '*' spans '/', so explicitly reject deeper Application paths.
      # Ordinary workload directories become eligible as soon as published in Git.
      # Experimental metrics are developed in their WIP; kube-vip is Ansible-managed.
      # Pi-hole is isolated in its own WIP. These applications must not be rediscovered.
      exclude: '{workloads/*/*/application.yml,workloads/optional/*,workloads/disabled/*,workloads/kube-vip/*,workloads/pihole/*,workloads/kube-prometheus-stack/*}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      allowEmpty: false
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
